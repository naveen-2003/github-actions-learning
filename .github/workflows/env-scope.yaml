name: Envrionment Variables
on:
  workflow_dispatch:
env:
  WORKFLOW_ENV: "Workflow ENV"
jobs:
  job-1:
    env:
      JOB_ENV: "Job ENV declared inside job-1"
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 inside JOB-1
        env:
          STEP_ENV: "Step-1 ENV inside JOB-1"
        run: |
          echo $WORKFLOW_ENV
          echo $JOB_ENV
          echo $STEP_ENV
      - name: Step 2 inside JOB-1
        run: |
          echo $WORKFLOW_ENV
          echo ${JOB_ENV:-"JOB_ENV is not available"}
          echo ${STEP_ENV:-"STEP_ENV not available"}
  job-2:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 inside JOB-2
        run: |
          echo $WORKFLOW_ENV
          echo ${JOB_ENV:-"JOB_ENV is not available"}
          echo ${STEP_ENV:-"STEP_ENV not available"}

      