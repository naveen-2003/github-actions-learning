name: Passing value between the Jobs and Steps
on:
  workflow_dispatch:

jobs:
  job-1:
    runs-on: ubuntu-latest
    outputs:
      VALUE2: ${{steps.set-value-1.outputs.VALUE2}}
    steps:
      - run: echo "VALUE1='Values from job-1, step-1'" >> $GITHUB_ENV
        id: set-value-1
      - run: echo "VALUE2='Values from job-1, step-1'" >> $GITHUB_OUTPUT
        id: set-value-2
      - run: |
          echo "$VALUE1"
          echo "${{steps.set-value-1.outputs.VALUE2}}"
  job-2:
    runs-on: ubuntu-latest
    needs:
      - job-1
    steps:
      - run: echo "Value from job-1:\ ${{needs.job-1.outputs.VALUE2}}"