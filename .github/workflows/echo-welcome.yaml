name: First Github action
on:
  workflow_dispatch: 
jobs:
    echo-welcome:
      runs-on: ubuntu-latest
      steps:
        - name: Welcome message!
          run: echo "Welcome, Naveen!, Congrats on executing your first GitHub Actions...🎉"
        - name: Again Welcome from python
          shell: python
          run: print("Welcome again Naveen!!")
        - name: Welcome again from action
          uses: actions/hello-world-javascript-action@ebdda30dcb464fa90dc49c837d7b5506f49932d0 
          with:
            who-to-greet: Naveen