name: Environment Variables & Secrets
on:
  workflow_dispatch:
jobs:
  stage-env:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - run: echo "TEST_REPO_SECRET:${{secrets.TEST_REPO_SECRET}}"
      - run: echo "TEST_SECRET:${{secrets.TEST_SECRET}}"
      - run: echo "TEST_REPO_ENV:${{secrets.TEST_REPO_ENV}}"
      - run: echo "TEST_ENV:${{secrets.TEST_ENV}}"
  prod-env:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "TEST_REPO_SECRET:${{secrets.TEST_REPO_SECRET}}"
      - run: echo "TEST_SECRET:${{secrets.TEST_SECRET}}"
      - run: echo "TEST_REPO_ENV:${{secrets.TEST_REPO_ENV}}"
      - run: echo "TEST_ENV:${{secrets.TEST_ENV}}"