name: Environment Variables & Secrets
on:
  workflow_dispatch:
jobs:
  job-1:
    runs-on: ubuntu-latest
    steps:
      - run: echo "TEST_REPO_SECRET:${{secrets.TEST_REPO_SECRET}}"
      - run: echo "TEST_STAGING_SECRET:${{secrets.TEST_STAGING_SECRET}}"
      - run: echo "TEST_PRODUCTION_SECRET:${{secrets.TEST_PRODUCTION_SECRET}}"
      - run: echo "TEST_REPO_ENV:${{secrets.TEST_REPO_ENV}}"
      - run: echo "TEST_STAGING_ENV:${{secrets.TEST_STAGING_ENV}}"
      - run: echo "TEST_PRODUCTION_ENV:${{secrets.TEST_PRODUCTION_ENV}}"