name: Events
on:
  push:
    paths: 
      - ".github/workflow/**"
    branches:
      - main
  schedule:
    - cron: "19 9 1 12 1"
  create:
  delete: 
  issues: 
    types:
      - opened
      - closed
  pull_request:
    paths: 
      - "README.md"
  workflow_run: 
    types: 
      - completed
    workflows: 
      - "Trigger for events workflow"
  workflow_dispatch:
jobs:
  events-test:
    runs-on: ubuntu-latest
    steps:
      - run: echo ${{github.event_name}}
